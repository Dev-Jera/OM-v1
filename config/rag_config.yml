# RAG pipeline configuration (embeddings, vector store, retrieval, generation)
# Vector store provider: pgvector (Neon/Postgres) or qdrant_* (local/remote Qdrant)
# If you change the embedder (e.g. 384-dim -> 3072-dim), run:
#   python scripts/recreate_vector_table.py --yes && python scripts/generate_embeddings.py

embeddings:
  provider: gemini  # sentence_transformers | openai | gemini | ollama
  model: models/gemini-embedding-001
  output_dimensionality: 1536  # keep <= 2000 for pgvector ivfflat index; 768/1536/3072 supported
  # For OpenAI: model: text-embedding-3-small
  # For Gemini: models/gemini-embedding-001; use output_dimensionality 1536 for pgvector
  # For Ollama: model: nomic-embed-text, base_url: http://localhost:11434

vector_store:
  provider: qdrant_http   # pgvector | qdrant_local | qdrant_http
  collection: Mia-chatbot
  # pgvector: uses DATABASE_URL from environment
  # qdrant_local: path: data/qdrant
  # qdrant_http: host/port below (local/docker-compose)
  #
  # Hosted overrides (set as env vars, no YAML edits needed):
  #   RAG_VECTOR_PROVIDER  -> vector_store.provider
  #   QDRANT_URL           -> e.g. https://xxx.<region>.cloud.qdrant.io (Qdrant Cloud)
  #   QDRANT_API_KEY       -> Qdrant Cloud API key
  #   QDRANT_COLLECTION    -> vector_store.collection
  #   QDRANT_HOST / QDRANT_PORT -> vector_store.host / vector_store.port
  #
  # To switch providers at runtime: RAG_VECTOR_PROVIDER=pgvector (uses DATABASE_URL)
  # or RAG_VECTOR_PROVIDER=qdrant_http (uses QDRANT_URL + QDRANT_API_KEY).
  host: qdrant
  port: 6333

retrieval:
  top_k: 5   # fetch more chunks so product-specific queries (e.g. Somesa Plan) get relevant context
  fetch_k: 25  # candidate pool before final rerank (was 10)
  hybrid:
    enabled: true
    dense_weight: 0.7
    sparse_weight: 0.3
    rrf_k: 60  # position-fusion constant

generation:
  enabled: true
  backend: gemini
  # If you see "free_tier ... limit: 0", enable billing in Google AI Studio for this project
  model: "gemini-3.6-flash"
  api_key_env: GEMINI_API_KEY
