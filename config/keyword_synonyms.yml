# Keyword/Synonym mappings for query expansion
# Format: keyword -> list of synonyms/related terms

synonyms:
  # Product names to categories/descriptions
  what is in it for you:
    - benefits
    - value
    - advantages
    - gains
    - rewards
    - usefulness

  serenicare:
    - health care
    - health insurance
    - medical insurance
    - healthcare
    - medical cover

  somesa:
    - Somesa Education Plan
    - SOMESA Plus
    - somesa education plan
    - education savings
  "somesa plan":
    - Somesa Education Plan
    - SOMESA Plus
    - somesa education

  # Add more mappings as needed
  family life protection:
    - life insurance
    - term life
    - death benefit

  # How-to / payment vocabulary so the bot surfaces the actual payment/application
  # chunks (which describe UAPLIFE, merchant code, *185#, forms) instead of falling back.
  pay:
    - payment methods
    - pay your premium
    - mobile money
    - UAPLIFE
    - merchant code
    - deposit
  premium:
    - premiums
    - pay your premium
    - contributions
  apply:
    - how do i apply
    - application form
    - application
    - requirements
  claim:
    - claims
    - make a claim
    - benefits payable
    - claim process
  renew:
    - renewal
    - renew my policy
  contributions:
    - contribute
    - make contributions
    - premium payments
  minimum investment:
    - minimum lump sum
    - purchase units
    - investment advisor
    - initial amount

  motor private:
    - car insurance
    - vehicle insurance
    - auto insurance
    - motor insurance

  all risks cover:
    - all risk cover
    - all risks insurance
    - item insurance
    - gadget insurance
    - item cover

# Category mappings
categories:
  health:
    - medical
    - healthcare
    - hospital
    - clinic

  life:
    - death benefit
    - term life
    - whole life

# Common abbreviations
abbreviations:
  hi: health insurance
  li: life insurance
  mi: motor insurance
